<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Record">
<meta name="theme-color" content="#121016" id="themeColor">
<script>
// 主題：auto（跟隨系統）/ light / dark，存在本機
(function(){ let t = 'auto'; try { t = localStorage.getItem('theme') || 'auto'; } catch(e){}
  if(t !== 'auto') document.documentElement.dataset.theme = t; })();
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>Record</title>
<style>
/* 淺色 */
:root{--bg:#f6f4f8;--card:#ffffff;--card2:#efebf3;--line:#e4dfe9;--text:#1f1a26;--sub:#7a7285;--accent:#ff4f80;--gold:#f5a623;--danger:#e5484d;--ok:#2fb36f;
  --bar:rgba(246,244,248,.86);--ph:#ebe6f0;--ph-t:#b9b0c3;--star-off:#d9d3df;--muted:#3d3546;--danger-line:#f3c9cb;--toast:#2a2431;--chip-on:#d6336c;--shadow:0 1px 3px rgba(40,20,60,.06);--r:16px;color-scheme:light}
/* 深色 */
:root[data-theme="dark"]{--bg:#121016;--card:#1d1a23;--card2:#28232f;--line:#332e3b;--text:#f3eff6;--sub:#a39cad;--accent:#ff5c8a;--gold:#ffc24b;--danger:#ff6b6b;--ok:#4fd18b;
  --bar:rgba(18,16,22,.86);--ph:#2a2531;--ph-t:#5d5568;--star-off:#4a4352;--muted:#ddd6e3;--danger-line:#4a2a2e;--toast:#3a3442;--chip-on:#ffb3c8;--shadow:none;color-scheme:dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121016;--card:#1d1a23;--card2:#28232f;--line:#332e3b;--text:#f3eff6;--sub:#a39cad;--accent:#ff5c8a;--gold:#ffc24b;--danger:#ff6b6b;--ok:#4fd18b;
  --bar:rgba(18,16,22,.86);--ph:#2a2531;--ph-t:#5d5568;--star-off:#4a4352;--muted:#ddd6e3;--danger-line:#4a2a2e;--toast:#3a3442;--chip-on:#ffb3c8;--shadow:none;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
a{color:inherit}
.top{position:sticky;top:0;z-index:10;background:var(--bar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(env(safe-area-inset-top) + 8px) 16px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.top h1{flex:1;font-size:20px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 .logo{color:var(--accent);vertical-align:-4px;margin-right:7px}
.ib{background:var(--card2);border:0;color:var(--text);min-width:38px;height:38px;border-radius:12px;font:inherit;font-size:15px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:4px;text-decoration:none;cursor:pointer;flex-shrink:0}
.ib.big{font-size:22px;padding:0 10px}
.ib.primary{background:var(--accent);color:#fff;font-weight:600}
.wrap{padding:14px 16px calc(40px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.datebtn{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:46px;text-align:left;font:inherit;font-size:16px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.datebtn.empty{color:var(--ph-t)}
.datebtn svg{color:var(--sub);flex-shrink:0}
.cal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55;display:none}
.cal-bg.open{display:block}
.cal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,340px);background:var(--card);border-radius:20px;padding:14px;z-index:56;display:none;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.cal.open{display:block}
.cal .ch{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.cal .ch select{flex:1;width:auto;padding:8px 24px 8px 8px;font-weight:600;text-align:center;text-align-last:center;background-position:calc(100% - 12px) 50%,calc(100% - 7px) 50%;background-color:var(--card2);border-color:transparent}
.cal .ch .ib{width:38px;font-size:20px;padding:0}
.cal .wd,.cal .days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .wd span{font-size:12px;color:var(--sub);padding:4px 0 6px}
.cal .days button{aspect-ratio:1;border:0;background:none;border-radius:50%;font:inherit;font-size:15px;color:var(--text);cursor:pointer;padding:0}
.cal .days button.today{color:var(--accent);font-weight:700}
.cal .days button.sel{background:var(--accent);color:#fff;font-weight:700}
.cal .cf{display:flex;gap:8px;margin-top:10px}
.cal .cf .btn{margin:0;padding:11px;font-size:15px}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.search{display:flex;gap:8px;margin-bottom:14px}
.search select{width:auto;flex-shrink:0}
.stats{display:flex;gap:10px;margin-bottom:14px}
.stats div{flex:1;background:var(--card);border-radius:14px;padding:10px 12px}
.stats b{display:block;font-size:20px}
.stats span{font-size:12px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--card);box-shadow:var(--shadow);border-radius:var(--r);overflow:hidden;text-decoration:none;display:block}
.cover{aspect-ratio:3/4;background:var(--ph) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;color:var(--ph-t);position:relative}
.badge{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px}
.badge.yes{background:rgba(79,209,139,.85);color:#06210f}.badge.maybe{background:rgba(255,194,75,.88);color:#2a1d00}.badge.no{background:rgba(120,110,130,.8)}
.cinfo{padding:10px 12px 12px}
.cname{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cname small{font-weight:400;color:var(--sub);font-size:13px;margin-left:4px}
.cmeta{font-size:12.5px;color:var(--sub);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{color:var(--gold);letter-spacing:1px;white-space:nowrap}.st i{font-style:normal;color:var(--star-off)}
.empty{text-align:center;color:var(--sub);padding:70px 20px;line-height:1.7}
.empty .big{font-size:52px}
.hero{display:flex;gap:14px;align-items:center}
.hero .av{width:92px;height:92px;border-radius:22px;background:var(--ph) center/cover;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700;color:var(--ph-t)}
.hero .t{min-width:0;line-height:1.55}
.hero .t .l1{font-size:15px}
.hero .t .l2{font-size:13px;color:var(--sub)}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;margin:16px 0 14px}
.seg button{flex:1;background:none;border:0;color:var(--sub);padding:9px 0;border-radius:10px;font:inherit;font-size:14px;cursor:pointer}
.seg button.on{background:var(--card2);color:var(--text);font-weight:600}
.panel{background:var(--card);box-shadow:var(--shadow);border-radius:var(--r);padding:2px 14px;margin-bottom:12px}
.panel h3{font-size:13px;color:var(--sub);font-weight:500;margin:12px 0 2px}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:14px;font-size:15px}
.row:last-child{border:0}
.row .k{color:var(--sub);flex-shrink:0}
.row .v{text-align:right;word-break:break-word;white-space:pre-wrap}
.note{white-space:pre-wrap;line-height:1.65;padding:12px 0;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0}
.chip{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 12px;font-size:13.5px;font:inherit;font-size:13.5px;cursor:pointer}
.chip.on{background:rgba(255,92,138,.18);border-color:var(--accent);color:var(--chip-on)}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:14px;border-radius:14px;border:0;font:inherit;font-weight:600;font-size:16px;background:var(--accent);color:#fff;margin-top:10px;cursor:pointer;text-decoration:none}
.btn.ghost{background:var(--card2);color:var(--text)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger-line)}
.btns{display:flex;gap:10px}.btns .btn{margin-top:0}
.field{margin-bottom:12px}
.field>label{display:block;font-size:13px;color:var(--sub);margin:0 0 6px 4px}
.field>label em{color:var(--accent);font-style:normal}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.unit{position:relative}.unit input{padding-right:38px}.unit span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:13px;pointer-events:none}
.stars-in{display:flex;gap:2px}
.stars-in button{background:none;border:0;font-size:30px;line-height:1;color:var(--star-off);padding:2px 3px;cursor:pointer}
.stars-in button.on{color:var(--gold)}
.srow{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.srow>span{color:var(--sub);font-size:14px}
.srow .stars-in button{font-size:24px}
.pick{display:flex;gap:8px}
.pick button{flex:1;background:var(--card);border:1px solid var(--line);color:var(--sub);border-radius:12px;padding:11px 0;font:inherit;font-size:15px;cursor:pointer}
.pick button.on{border-color:var(--accent);color:var(--text);background:rgba(255,92,138,.14)}
.checks{display:flex;gap:10px;margin-bottom:12px}
.ck{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:16px;cursor:pointer}
.ck input{-webkit-appearance:none;appearance:none;width:22px;height:22px;padding:0;margin:0;border:2px solid var(--sub);border-radius:6px;background:transparent;flex-shrink:0;display:grid;place-content:center}
.ck input:checked{background:var(--accent);border-color:var(--accent)}
.ck input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.ck:has(input:checked){border-color:var(--accent)}
.meet{background:var(--card);box-shadow:var(--shadow);border-radius:var(--r);padding:14px;margin-bottom:10px;cursor:pointer}
.meet .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.meet .d{font-weight:700;font-size:16px}
.meet .p{color:var(--sub);font-size:13.5px;margin-top:3px}
.meet .n{margin-top:8px;font-size:14.5px;line-height:1.6;white-space:pre-wrap;color:var(--muted)}
.meet .no{font-size:12px;color:var(--sub);margin-right:6px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.photos div{aspect-ratio:1;background:var(--ph) center/cover;border-radius:8px;position:relative;cursor:pointer}
.photos div .tag{position:absolute;left:5px;bottom:5px;font-size:10.5px;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:6px}
.photos div .star{position:absolute;right:5px;top:5px;font-size:12px;background:var(--accent);padding:1px 6px;border-radius:6px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:720px;margin:0 auto}
.sheet.open{transform:none}
.sheet .sh{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px;z-index:2}
.sheet .sh b{font-size:17px}
.sheet .sh button{background:none;border:0;color:var(--sub);font:inherit;font-size:15px;cursor:pointer}
.viewer{position:fixed;inset:0;background:#000;z-index:60;display:none;flex-direction:column}
.viewer.open{display:flex}
.viewer .vt,.viewer .vb{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:8px}
.viewer .vt{padding-top:calc(env(safe-area-inset-top) + 10px)}
.viewer .vb{padding-bottom:calc(env(safe-area-inset-bottom) + 12px)}
.viewer .vi{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transform-origin:center center;will-change:transform;pointer-events:none}
.viewer img.anim{transition:transform .22s ease}
.viewer .cnt{color:#bbb;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--toast);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:80;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
.hint{font-size:13px;color:var(--sub);line-height:1.7}
.hint ol{padding-left:20px;margin:6px 0}
.sec-t{font-size:13px;color:var(--sub);margin:18px 4px 8px}
.filter{display:flex;gap:6px;margin-bottom:10px}
.seg.home{margin:0 0 14px}
.mpick{display:flex;gap:8px;margin-bottom:14px;align-items:center}
.mpick select{flex:1;text-align:center;text-align-last:center;font-weight:600;padding-right:12px;background-image:none}
.mpick .ib{font-size:22px;padding:0 10px;height:46px;min-width:46px}
.ib:disabled{opacity:.3;cursor:default}
.stats b small{font-size:12px;font-weight:400;color:var(--sub);margin-left:2px}
.mrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.mrow:last-child{border:0}
.mrow .dt{width:50px;flex-shrink:0;text-align:center;line-height:1.3}
.mrow .dt b{display:block;font-size:17px}
.mrow .dt span{font-size:11.5px;color:var(--sub)}
.mrow .who{flex:1;min-width:0}
.mrow .who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .who span{font-size:12.5px;color:var(--sub)}
.mrow .amt{font-weight:700;font-size:15px;flex-shrink:0;white-space:nowrap}
.mrow .amt.none{color:var(--ph-t);font-weight:400}
</style>
</head>
<body>
<div id="app"></div>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="viewer" id="viewer"></div>
<div class="cal-bg" id="calBg"></div>
<div class="cal" id="cal"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="image/*" multiple hidden>
<input type="file" id="importIn" accept="application/json,.json" hidden>
<script>
'use strict';
/* ---------- utils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const fmtDate = s => s ? s.replace(/-/g, '/') : '';
function daysAgo(s){ if(!s) return ''; const n = Math.round((new Date(today()) - new Date(s)) / 864e5); return n === 0 ? '今天' : n > 0 ? `${n} 天前` : `${-n} 天後`; }
let urls = [];
const objURL = b => { if(!b) return ''; const u = URL.createObjectURL(b); urls.push(u); return u; };
const freeURLs = () => { urls.forEach(u => URL.revokeObjectURL(u)); urls = []; };
function toast(msg, ms = 1800){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms); }
const starsView = v => { v = Math.round(v || 0); return `<span class="st">${'★'.repeat(v)}<i>${'★'.repeat(5 - v)}</i></span>`; };
const INTENT = { yes: '想再約', maybe: '考慮中', no: '不再約' };

/* ---------- IndexedDB ---------- */
let db;
function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('datelog', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('people', { keyPath: 'id' });
      d.createObjectStore('meetings', { keyPath: 'id' }).createIndex('personId', 'personId');
      d.createObjectStore('photos', { keyPath: 'id' }).createIndex('personId', 'personId');
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
const P = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const store = (s, m = 'readonly') => db.transaction(s, m).objectStore(s);
const getAll = s => P(store(s).getAll());
const get = (s, id) => P(store(s).get(id));
const put = (s, v) => P(store(s, 'readwrite').put(v));
const del = (s, id) => P(store(s, 'readwrite').delete(id));
const byPerson = (s, pid) => P(store(s).index('personId').getAll(pid));

/* ---------- image compress ---------- */
async function loadImg(file){
  try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch(e) {}
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
}
function resize(img, max, q){
  const w = img.width, h = img.height, s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', q));
}

/* ---------- stars input ---------- */
const starsInput = (name, val = 0) => `<div class="stars-in" data-name="${name}" data-val="${val||0}">${[1,2,3,4,5].map(i => `<button type="button" data-v="${i}" class="${i <= val ? 'on' : ''}">★</button>`).join('')}</div>`;
const readStars = (root, name) => +($(`.stars-in[data-name="${name}"]`, root)?.dataset.val || 0);
document.addEventListener('click', e => {
  const b = e.target.closest('.stars-in button'); if(b){
    const w = b.parentElement; let v = +b.dataset.v; if(+w.dataset.val === v) v = 0;
    w.dataset.val = v; [...w.children].forEach((c, i) => c.classList.toggle('on', i < v)); return;
  }
  const pk = e.target.closest('.pick:not(.tpick) button'); if(pk){
    const wasOn = pk.classList.contains('on');
    $$('button', pk.parentElement).forEach(x => x.classList.remove('on'));
    if(!wasOn) pk.classList.add('on'); return;
  }
  const ch = e.target.closest('.chips.sel .chip'); if(ch){ ch.classList.toggle('on'); }
});

/* ---------- sheet ---------- */
function openSheet(title, html, mount){
  const s = $('#sheet');
  s.innerHTML = `<div class="sh"><button data-close>取消</button><b>${esc(title)}</b><span style="width:34px"></span></div>${html}`;
  s.scrollTop = 0;
  void s.offsetHeight; // 強制排版後再開啟，確保有動畫且不會與關閉競爭
  s.classList.add('open'); $('#sheetBg').classList.add('open');
  $('[data-close]', s).onclick = closeSheet;
  mount && mount(s);
}
function closeSheet(){ $('#sheet').classList.remove('open'); $('#sheetBg').classList.remove('open'); }
$('#sheetBg').onclick = closeSheet;

/* ---------- date picker（自訂月曆，避開 iOS 原生選擇器切換月份後自動關閉的問題） ---------- */
const pad2 = n => String(n).padStart(2, '0');
const CAL_ICON = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
// 產生日期欄位：隱藏 input 存 YYYY-MM-DD，按鈕顯示並開啟月曆
const dateField = (name, val, id) => `<div class="datef"><input type="hidden" ${name ? `name="${name}"` : ''} ${id ? `id="${id}"` : ''} value="${esc(val || '')}"><button type="button" class="datebtn ${val ? '' : 'empty'}"><span>${val ? fmtDate(val) : '選擇日期'}</span>${CAL_ICON}</button></div>`;
function openCal(inp, btn){
  const cal = $('#cal'), bg = $('#calBg');
  const t = today();
  const valid = v => /^\d{4}-\d{2}-\d{2}$/.test(v || '');
  let [y, m] = (valid(inp.value) ? inp.value : t).split('-').map(Number);
  const pick = iso => { inp.value = iso; $('span', btn).textContent = iso ? fmtDate(iso) : '選擇日期'; btn.classList.toggle('empty', !iso); closeCal(); };
  const draw = () => {
    const first = new Date(y, m - 1, 1).getDay(), dim = new Date(y, m, 0).getDate();
    const ty = +t.slice(0, 4), years = [];
    for(let i = Math.max(ty + 1, y); i >= Math.min(1970, y); i--) years.push(i);
    cal.innerHTML = `
      <div class="ch"><button type="button" class="ib" id="cPrev" aria-label="上個月">‹</button>
        <select id="cY">${years.map(i => `<option value="${i}" ${i === y ? 'selected' : ''}>${i} 年</option>`).join('')}</select>
        <select id="cM">${Array.from({ length: 12 }, (_, i) => `<option value="${i + 1}" ${i + 1 === m ? 'selected' : ''}>${i + 1} 月</option>`).join('')}</select>
        <button type="button" class="ib" id="cNext" aria-label="下個月">›</button></div>
      <div class="wd">${['日', '一', '二', '三', '四', '五', '六'].map(d => `<span>${d}</span>`).join('')}</div>
      <div class="days">${'<span></span>'.repeat(first)}${Array.from({ length: dim }, (_, i) => {
        const iso = `${y}-${pad2(m)}-${pad2(i + 1)}`;
        return `<button type="button" data-d="${iso}" class="${iso === inp.value ? 'sel' : ''} ${iso === t ? 'today' : ''}">${i + 1}</button>`; }).join('')}</div>
      <div class="cf"><button type="button" class="btn ghost" id="cToday">今天</button><button type="button" class="btn ghost" id="cClear">清除</button></div>`;
    $('#cPrev', cal).onclick = () => { if(--m < 1){ m = 12; y--; } draw(); };
    $('#cNext', cal).onclick = () => { if(++m > 12){ m = 1; y++; } draw(); };
    $('#cY', cal).onchange = e => { y = +e.target.value; draw(); };
    $('#cM', cal).onchange = e => { m = +e.target.value; draw(); };
    $$('.days button', cal).forEach(b => b.onclick = () => pick(b.dataset.d));
    $('#cToday', cal).onclick = () => pick(t);
    $('#cClear', cal).onclick = () => pick('');
  };
  draw();
  cal.classList.add('open'); bg.classList.add('open');
}
function closeCal(){ $('#cal').classList.remove('open'); $('#calBg').classList.remove('open'); }
$('#calBg').onclick = closeCal;
document.addEventListener('click', e => {
  const b = e.target.closest('.datebtn'); if(b) openCal(b.previousElementSibling, b);
});

/* ---------- router ---------- */
let lastHash = '';
async function route(){
  const h = location.hash.slice(1) || '/';
  const parts = h.split('/').filter(Boolean);
  closeSheet(); closeViewer(); closeCal();
  if(h !== lastHash) window.scrollTo(0, 0);
  lastHash = h;
  freeURLs();
  if(!parts.length) return renderList();
  if(parts[0] === 'new') return renderForm(null);
  if(parts[0] === 'settings') return renderSettings();
  if(parts[0] === 'p' && parts[2] === 'edit') return renderForm(parts[1]);
  if(parts[0] === 'p') return renderDetail(parts[1]);
  location.hash = '#/';
}
window.addEventListener('hashchange', route);

/* ---------- list ---------- */
const listState = { q: '', sort: 'recent', tab: 'people', month: '' };
async function renderList(){
  const [people, meetings, photos] = await Promise.all([getAll('people'), getAll('meetings'), getAll('photos')]);
  const last = {}, cnt = {}, firstPhoto = {};
  meetings.forEach(m => { cnt[m.personId] = (cnt[m.personId] || 0) + 1; if(!last[m.personId] || m.date > last[m.personId]) last[m.personId] = m.date; });
  const photoById = {}; photos.forEach(p => { photoById[p.id] = p; if(!firstPhoto[p.personId] || p.createdAt < firstPhoto[p.personId].createdAt) firstPhoto[p.personId] = p; });

  app.innerHTML = `
  <header class="top"><h1><svg class="logo" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 8 3.3 4.5 6.8 4.5c2 0 3.6 1.1 4.4 2.5.8-1.4 2.4-2.5 4.4-2.5 3.5 0 5.4 3.5 4.1 6.8-1.8 4.6-9.3 9.2-9.3 9.2z" /></svg>Record</h1>
    <a class="ib gear" href="#/settings" aria-label="設定"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
    <a class="ib primary" href="#/new">＋ 新增</a></header>
  <div class="wrap">
    <div class="seg home" id="hseg"><button data-t="people">對象</button><button data-t="cost">花費</button></div>
    <div id="home"></div>
  </div>`;
  const home = $('#home');

  const drawPeople = () => {
    home.innerHTML = `
    <div class="stats">
      <div><b>${people.length}</b><span>人數</span></div>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="搜尋暱稱、地點、國籍、標籤…" value="${esc(listState.q)}">
      <select id="sort">
        <option value="recent">最近見面</option><option value="rating">評分高→低</option>
        <option value="created">最新新增</option><option value="name">暱稱</option>
      </select>
    </div>
    <div class="grid" id="grid"></div>`;
    $('#sort').value = listState.sort;
    draw();
    $('#q').oninput = e => { listState.q = e.target.value; draw(); };
    $('#sort').onchange = e => { listState.sort = e.target.value; draw(); };
  };

  const draw = () => {
    const q = listState.q.trim().toLowerCase();
    let arr = people.filter(p => !q || [p.nickname, p.location, p.nationality, p.cup, ...(p.review?.tags || [])].join(' ').toLowerCase().includes(q));
    const S = listState.sort;
    arr.sort((a, b) =>
      S === 'rating' ? (b.review?.overall || 0) - (a.review?.overall || 0) :
      S === 'created' ? b.createdAt - a.createdAt :
      S === 'name' ? (a.nickname || '').localeCompare(b.nickname || '', 'zh-Hant') :
      (last[b.id] || b.metDate || '').localeCompare(last[a.id] || a.metDate || ''));
    const g = $('#grid');
    if(!people.length){ g.outerHTML = `<div class="empty"><div class="big">📒</div>還沒有任何紀錄<br>點右上角「＋ 新增」開始</div>`; return; }
    if(!arr.length){ g.innerHTML = `<div class="empty" style="grid-column:1/-1">找不到符合的紀錄</div>`; return; }
    g.innerHTML = arr.map(p => {
      const ph = photoById[p.coverId] || firstPhoto[p.id];
      const sub = [p.age && p.age + '歲', p.height && p.height + 'cm', p.cup && p.cup].filter(Boolean).join(' · ');
      return `<a class="card" href="#/p/${p.id}">
        <div class="cover" style="${ph ? `background-image:url(${objURL(ph.thumb || ph.blob)})` : ''}">${ph ? '' : esc((p.nickname || '?').slice(0, 1))}</div>
        <div class="cinfo">
          <div class="cname">${esc(p.nickname)}<small>${esc(sub)}</small></div>
          <div class="cmeta">📍${esc([p.location, p.nationality].filter(Boolean).join(' · ') || '—')}</div>
          <div class="cmeta">${starsView(p.review?.overall)}</div>
        </div></a>`;
    }).join('');
  };

  // 花費分頁：選擇月份，顯示該月的統計與每次見面的對象、時間、鐘點、次數與金額
  const money = n => '$' + Math.round(n).toLocaleString();
  const monthLabel = k => { const [y, mo] = k.split('-'); return `${+y} 年 ${+mo} 月`; };
  const drawCost = () => {
    const name = {}; people.forEach(p => name[p.id] = p.nickname);
    const ms = meetings.filter(m => m.date).sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || '')) || b.createdAt - a.createdAt);
    const groups = {}; ms.forEach(m => { const k = m.date.slice(0, 7); (groups[k] = groups[k] || []).push(m); });
    // 可選月份：有紀錄的月份 + 本月，新到舊
    const months = [...new Set([today().slice(0, 7), ...Object.keys(groups)])].sort().reverse();
    if(!months.includes(listState.month)) listState.month = months.find(k => groups[k]) || months[0];
    const k = listState.month, arr = groups[k] || [], idx = months.indexOf(k);
    const sum = arr.reduce((t, m) => t + (+m.cost || 0), 0);
    const tmin = arr.reduce((t, m) => t + (+mins(m) || 0), 0);
    const total = ms.reduce((t, m) => t + (+m.cost || 0), 0);
    home.innerHTML = `
    <div class="mpick">
      <button type="button" class="ib" id="mPrev" ${idx >= months.length - 1 ? 'disabled' : ''} aria-label="上個月">‹</button>
      <select id="mSel">${months.map(x => `<option value="${x}" ${x === k ? 'selected' : ''}>${monthLabel(x)}${groups[x] ? `（${groups[x].length} 次）` : ''}</option>`).join('')}</select>
      <button type="button" class="ib" id="mNext" ${idx <= 0 ? 'disabled' : ''} aria-label="下個月">›</button>
    </div>
    <div class="stats">
      <div><b>${money(sum)}</b><span>本月花費</span></div>
      <div><b>${arr.length}</b><span>見面次數</span></div>
      <div><b>${tmin ? tmin + '<small>分</small>' : '—'}</b><span>鐘點合計</span></div>
    </div>
    ${arr.length ? `<div class="panel" style="padding:2px 14px">${arr.map(m => `<a class="mrow" href="#/p/${m.personId}">
        <div class="dt"><b>${+m.date.slice(8)}日</b><span>${esc(m.time) || '—'}</span></div>
        <div class="who"><b>${esc(name[m.personId] || '（已刪除）')}</b><span>${[mins(m) && '⏱ ' + esc(mins(m)) + ' 分鐘', m.times && '🔁 ' + esc(m.times) + ' 次'].filter(Boolean).join('　') || '&nbsp;'}</span></div>
        <div class="amt ${m.cost ? '' : 'none'}">${m.cost ? money(+m.cost) : '—'}</div></a>`).join('')}</div>`
      : `<div class="empty" style="padding:50px 20px"><div class="big">💰</div>${monthLabel(k)}沒有見面紀錄</div>`}
    <div class="hint" style="text-align:center;margin-top:18px">全部累計 ${money(total)} · ${ms.length} 次</div>`;
    $('#mSel').onchange = e => { listState.month = e.target.value; drawCost(); };
    $('#mPrev').onclick = () => { listState.month = months[idx + 1]; drawCost(); };
    $('#mNext').onclick = () => { listState.month = months[idx - 1]; drawCost(); };
  };

  const showHome = t => {
    listState.tab = t;
    $$('#hseg button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
    t === 'cost' ? drawCost() : drawPeople();
  };
  $$('#hseg button').forEach(b => b.onclick = () => showHome(b.dataset.t));
  showHome(listState.tab);
}

/* ---------- person form ---------- */
const NATIONS = ['台灣','泰國','越南','印尼','大陸','港澳','俄羅斯','日本','韓國'];
const CUPS = ['','A','B','C','D','E','F','G','H','I+'];
async function renderForm(id){
  const p = id ? await get('people', id) : { metDate: today() };
  if(id && !p){ location.hash = '#/'; return; }
  app.innerHTML = `
  <header class="top"><a class="ib big" href="${id ? '#/p/' + id : '#/'}">‹</a><h1>${id ? '編輯資料' : '新增對象'}</h1>
    <button class="ib primary" id="save">儲存</button></header>
  <form class="wrap" id="f" autocomplete="off">
    <div class="field"><label>暱稱 <em>*</em></label><input name="nickname" required value="${esc(p.nickname)}" placeholder="例如：小美"></div>
    <div class="two">
      <div class="field"><label>地點</label><input name="location" value="${esc(p.location)}" placeholder="台北 / 信義區"></div>
      <div class="field"><label>日期</label>${dateField('metDate', p.metDate)}</div>
    </div>
    <div class="two">
      <div class="field"><label>年齡</label><div class="unit"><input name="age" type="number" inputmode="numeric" value="${esc(p.age)}"><span>歲</span></div></div>
      <div class="field"><label>國籍</label><select name="nationality">
        ${['', ...NATIONS, ...(p.nationality && !NATIONS.includes(p.nationality) ? [p.nationality] : [])]
          .map(n => `<option value="${esc(n)}" ${(p.nationality || '') === n ? 'selected' : ''}>${esc(n) || '—'}</option>`).join('')}
      </select></div>
    </div>
    <div class="three">
      <div class="field"><label>身高</label><div class="unit"><input name="height" type="number" inputmode="decimal" value="${esc(p.height)}"><span>cm</span></div></div>
      <div class="field"><label>體重</label><div class="unit"><input name="weight" type="number" inputmode="decimal" value="${esc(p.weight)}"><span>kg</span></div></div>
      <div class="field"><label>罩杯</label><select name="cup">${CUPS.map(c => `<option value="${c}" ${p.cup === c ? 'selected' : ''}>${c || '—'}</option>`).join('')}</select></div>
    </div>
    <div class="checks">
      <label class="ck"><input type="checkbox" name="natural" ${p.natural ? 'checked' : ''}><span>天然</span></label>
      <label class="ck"><input type="checkbox" name="kg" ${p.kg ? 'checked' : ''}><span>KG</span></label>
    </div>
    <button class="btn" type="submit">儲存</button>
    ${id ? `<button class="btn danger" type="button" id="delP">刪除此對象（含見面紀錄與照片）</button>` : ''}  </form>`;
  const f = $('#f');
  const save = async e => {
    e && e.preventDefault();
    const fd = Object.fromEntries(new FormData(f));
    if(!fd.nickname.trim()){ toast('請填寫暱稱'); f.nickname.focus(); return; }
    const rec = { ...p, ...fd, natural: f.natural.checked, kg: f.kg.checked, nickname: fd.nickname.trim(), id: p.id || uid(), createdAt: p.createdAt || Date.now(), updatedAt: Date.now() };
    await put('people', rec);
    navigator.storage?.persist?.();
    toast('已儲存');
    location.hash = '#/p/' + rec.id;
  };
  f.onsubmit = save; $('#save').onclick = save;
  if(id) $('#delP').onclick = async () => {
    if(!confirm(`確定刪除「${p.nickname}」？所有見面紀錄與照片都會一併刪除，無法復原。`)) return;
    const [ms, ps] = await Promise.all([byPerson('meetings', id), byPerson('photos', id)]);
    for(const m of ms) await del('meetings', m.id);
    for(const x of ps) await del('photos', x.id);
    await del('people', id);
    toast('已刪除'); location.hash = '#/';
  };
}

/* ---------- detail ---------- */
let curTab = 'info', curPid = null, photoFilter = 'all';
async function renderDetail(id){
  const p = await get('people', id);
  if(!p){ location.hash = '#/'; return; }
  if(curPid !== id){ curTab = 'info'; curPid = id; photoFilter = 'all'; }
  const [meetings, photos] = await Promise.all([byPerson('meetings', id), byPerson('photos', id)]);
  meetings.sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.createdAt - a.createdAt);
  photos.sort((a, b) => b.createdAt - a.createdAt);
  const cover = photos.find(x => x.id === p.coverId) || photos[photos.length - 1];
  const l1 = [p.age && p.age + '歲', p.height && p.height + 'cm', p.weight && p.weight + 'kg', p.cup && p.cup + ' 罩杯', p.natural && '天然', p.kg && 'KG'].filter(Boolean).join(' · ');
  const l2 = [p.location && '📍' + p.location, p.nationality].filter(Boolean).join(' · ');
  const lastM = meetings[0];
  const scrollY = window.scrollY;
  app.innerHTML = `
  <header class="top"><a class="ib big" href="#/">‹</a><h1>${esc(p.nickname)}</h1><a class="ib" href="#/p/${id}/edit">編輯</a></header>
  <div class="wrap">
    <div class="hero">
      <div class="av" style="${cover ? `background-image:url(${objURL(cover.thumb || cover.blob)})` : ''}">${cover ? '' : esc((p.nickname || '?').slice(0, 1))}</div>
      <div class="t">
        <div class="l1">${esc(l1) || '<span style="color:var(--sub)">尚未填寫基本資料</span>'}</div>
        <div class="l2">${esc(l2)}</div>
        <div class="l2">${starsView(p.review?.overall)} ${p.review?.intent ? '· ' + INTENT[p.review.intent] : ''}</div>
        <div class="l2">${lastM ? `上次見面 ${fmtDate(lastM.date)}（${daysAgo(lastM.date)}）` : '尚無見面紀錄'}</div>
      </div>
    </div>
    <div class="seg" id="seg">
      <button data-t="info">資料</button><button data-t="review">評價</button>
      <button data-t="meet">見面 ${meetings.length || ''}</button><button data-t="photo">照片 ${photos.length || ''}</button>
    </div>
    <div id="tab"></div>
  </div>`;
  window.scrollTo(0, scrollY);
  const ctx = { p, meetings, photos };
  const show = t => { curTab = t; $$('#seg button').forEach(b => b.classList.toggle('on', b.dataset.t === t)); TABS[t](ctx); };
  $$('#seg button').forEach(b => b.onclick = () => show(b.dataset.t));
  show(curTab);
}
const refresh = () => renderDetail(curPid);

const TABS = {
  info({ p }){
    const rows = [['暱稱', p.nickname], ['地點', p.location], ['日期', p.metDate && `${fmtDate(p.metDate)}（${daysAgo(p.metDate)}）`], ['年齡', p.age && p.age + ' 歲'],
      ['身高', p.height && p.height + ' cm'], ['體重', p.weight && p.weight + ' kg'], ['罩杯', p.cup], ['天然', p.natural ? '✓' : ''], ['KG', p.kg ? '✓' : ''], ['國籍', p.nationality]];
    $('#tab').innerHTML = `
      <div class="panel">${rows.map(([k, v]) => `<div class="row"><span class="k">${k}</span><span class="v">${v ? esc(v) : '<span style="color:var(--ph-t)">—</span>'}</span></div>`).join('')}</div>
      <a class="btn ghost" href="#/p/${p.id}/edit">✎ 編輯基本資料</a>`;
  },
  review({ p }){
    const r = p.review || {};
    const has = r.overall || r.text || r.tags?.length || r.intent;
    $('#tab').innerHTML = has ? `
      <div class="panel">
        <div class="row"><span class="k">整體評分</span><span class="v" style="font-size:20px">${starsView(r.overall)}</span></div>
        ${SUBS.map(([k, n]) => r[k] ? `<div class="row"><span class="k">${n}</span><span class="v">${starsView(r[k])}</span></div>` : '').join('')}
        <div class="row"><span class="k">再約意願</span><span class="v">${INTENT[r.intent] || '—'}</span></div>
      </div>
      ${r.tags?.length ? `<div class="panel"><h3>標籤</h3><div class="chips">${r.tags.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div></div>` : ''}
      ${r.pros ? `<div class="panel"><h3>👍 優點</h3><div class="note">${esc(r.pros)}</div></div>` : ''}
      ${r.cons ? `<div class="panel"><h3>👎 缺點</h3><div class="note">${esc(r.cons)}</div></div>` : ''}
      ${r.text ? `<div class="panel"><h3>心得</h3><div class="note">${esc(r.text)}</div></div>` : ''}
      <button class="btn ghost" id="editR">✎ 編輯評價</button>`
      : `<div class="empty"><div class="big">⭐️</div>還沒有評價</div><button class="btn" id="editR">＋ 寫評價</button>`;
    $('#editR').onclick = () => reviewSheet(p);
  },
  meet({ p, meetings }){
    $('#tab').innerHTML = `<button class="btn" id="addM" style="margin:0 0 14px">＋ 新增見面紀錄</button>
      ${meetings.length ? meetings.map((m, i) => `<div class="meet" data-id="${m.id}">
        <div class="h"><span class="d"><span class="no">#${meetings.length - i}</span>${fmtDate(m.date)}${m.time ? ' ' + esc(m.time) : ''}</span>
        <span class="p" style="margin:0">${m.cost ? '💰 $' + esc(Number(m.cost).toLocaleString()) : ''}</span></div>
        ${mins(m) || m.times || m.noCondom ? `<div class="p">${[mins(m) && '⏱ 鐘點 ' + esc(mins(m)) + ' 分鐘', m.times && '🔁 ' + esc(m.times) + ' 次', m.noCondom && '<span style="color:var(--accent);font-weight:600">無套</span>'].filter(Boolean).join('　')}</div>` : ''}</div>`).join('')
      : `<div class="empty" style="padding-top:30px"><div class="big">☕️</div>還沒有見面紀錄</div>`}`;
    $('#addM').onclick = () => meetSheet(p, null);
    $$('.meet').forEach(el => el.onclick = () => meetSheet(p, meetings.find(m => m.id === el.dataset.id)));
  },
  photo({ p, photos }){
    const list = photos;
    $('#tab').innerHTML = `
      <button class="btn" id="upP" style="margin:0 0 14px">📷 上傳照片</button>
      ${list.length ? `<div class="photos">${list.map((x, i) => `<div data-i="${i}" style="background-image:url(${objURL(x.thumb || x.blob)})">
          ${x.id === p.coverId ? '<span class="star">封面</span>' : ''}</div>`).join('')}</div>`
        : `<div class="empty" style="padding-top:30px"><div class="big">🖼</div>還沒有照片</div>`}`;
    $('#upP').onclick = () => pickFiles(p, 'photo');
    $$('.photos div').forEach(el => el.onclick = () => openViewer(p, list, +el.dataset.i));
  }
};

/* ---------- review sheet ---------- */
const SUBS = [['looks', '外貌'], ['body', '身材'], ['personality', '個性'], ['talk', '聊天'], ['chemistry', '契合度']];
const PRESET_TAGS = ['溫柔','健談','幽默','有禮貌','好相處','主動','有話題','害羞','高冷','慢熟','愛滑手機'];
function reviewSheet(p){
  const r = p.review || {};
  const tags = r.tags || [];
  const custom = tags.filter(t => !PRESET_TAGS.includes(t));
  openSheet('評價', `
    <div class="panel" style="padding:10px 14px">
      <div class="srow"><span style="color:var(--text);font-weight:600">整體評分</span>${starsInput('overall', r.overall)}</div>
      ${SUBS.map(([k, n]) => `<div class="srow"><span>${n}</span>${starsInput(k, r[k])}</div>`).join('')}
    </div>
    <div class="field"><label>再約意願</label><div class="pick" id="intent">
      ${Object.entries(INTENT).map(([k, n]) => `<button type="button" data-v="${k}" class="${r.intent === k ? 'on' : ''}">${n}</button>`).join('')}</div></div>
    <div class="field"><label>標籤（點選）</label><div class="chips sel" style="padding-top:0">
      ${PRESET_TAGS.map(t => `<button type="button" class="chip ${tags.includes(t) ? 'on' : ''}">${t}</button>`).join('')}</div>
      <input id="ctags" placeholder="自訂標籤，用逗號分隔" value="${esc(custom.join(', '))}"></div>
    <div class="field"><label>優點</label><textarea id="pros" style="min-height:70px">${esc(r.pros)}</textarea></div>
    <div class="field"><label>缺點</label><textarea id="cons" style="min-height:70px">${esc(r.cons)}</textarea></div>
    <div class="field"><label>心得</label><textarea id="rtext">${esc(r.text)}</textarea></div>
    <button class="btn" id="saveR">儲存評價</button>`, s => {
    $('#saveR', s).onclick = async () => {
      const review = { overall: readStars(s, 'overall'), intent: $('#intent .on', s)?.dataset.v || '',
        tags: [...$$('.chips.sel .chip.on', s).map(c => c.textContent), ...$('#ctags', s).value.split(/[,，、]/).map(x => x.trim()).filter(Boolean)],
        pros: $('#pros', s).value, cons: $('#cons', s).value, text: $('#rtext', s).value };
      SUBS.forEach(([k]) => review[k] = readStars(s, k));
      await put('people', { ...p, review, updatedAt: Date.now() });
      closeSheet(); toast('評價已儲存'); refresh();
    };
  });
}

/* ---------- meeting sheet ---------- */
// 鐘點（分鐘）；舊資料存的是小時，自動換算
function mins(m){ return m.minutes || (m.hours ? String(Math.round(m.hours * 60)) : ''); }
function meetSheet(p, m){
  const isNew = !m; m = m || { date: today() };
  openSheet(isNew ? '新增見面' : '編輯見面', `
    <div class="two">
      <div class="field"><label>日期</label>${dateField(null, m.date, 'mdate')}</div>
      <div class="field"><label>時間</label><input type="time" id="mtime" value="${esc(m.time)}"></div>
    </div>
    <div class="two">
      <div class="field"><label>鐘點</label><div class="unit"><input id="mmins" type="number" inputmode="numeric" step="1" min="0" value="${esc(mins(m))}"><span>分鐘</span></div></div>
      <div class="field"><label>次數</label><div class="unit"><input id="mtimes" type="number" inputmode="numeric" min="0" value="${esc(m.times)}"><span>次</span></div></div>
    </div>
    <div class="checks"><label class="ck"><input type="checkbox" id="mnocondom" ${m.noCondom ? 'checked' : ''}><span>無套</span></label></div>
    <div class="field"><label>花費</label><div class="unit"><input id="mcost" type="number" inputmode="numeric" value="${esc(m.cost)}"><span>元</span></div></div>
    <button class="btn" id="saveM">儲存</button>
    ${isNew ? '' : '<button class="btn danger" id="delM">刪除這筆紀錄</button>'}`, s => {
    $('#saveM', s).onclick = async () => {
      const rec = { ...m, id: m.id || uid(), personId: p.id, createdAt: m.createdAt || Date.now(),
        date: $('#mdate', s).value || today(), time: $('#mtime', s).value,
        minutes: $('#mmins', s).value, hours: undefined, times: $('#mtimes', s).value, noCondom: $('#mnocondom', s).checked, cost: $('#mcost', s).value };
      await put('meetings', rec); closeSheet(); toast('已儲存'); curTab = 'meet'; refresh();
    };
    if(!isNew) $('#delM', s).onclick = async () => {
      if(!confirm('確定刪除這筆見面紀錄？')) return;
      await del('meetings', m.id); closeSheet(); toast('已刪除'); refresh();
    };
  });
}

/* ---------- photo upload ---------- */
let uploadCtx = null;
function pickFiles(p, kind){ uploadCtx = { p, kind }; const fi = $('#fileIn'); fi.value = ''; fi.click(); }
$('#fileIn').onchange = async e => {
  const files = [...e.target.files]; if(!files.length || !uploadCtx) return;
  const { p, kind } = uploadCtx; let ok = 0;
  for(let i = 0; i < files.length; i++){
    toast(`處理中 ${i + 1}/${files.length}…`, 60000);
    try {
      const img = await loadImg(files[i]);
      const blob = await resize(img, kind === 'shot' ? 2000 : 1600, 0.85);
      const thumb = await resize(img, 420, 0.75);
      img.close && img.close();
      await put('photos', { id: uid(), personId: p.id, kind, blob, thumb, createdAt: Date.now() + i });
      ok++;
    } catch(err){ console.error(err); }
  }
  toast(ok === files.length ? `已上傳 ${ok} 張` : `上傳 ${ok}/${files.length} 張（部分失敗）`);
  navigator.storage?.persist?.();
  curTab = 'photo'; photoFilter = 'all'; refresh();
};

/* ---------- viewer ---------- */
let vState = null, vURL = '';
function openViewer(p, list, i){
  vState = { p, list, i };
  const v = $('#viewer');
  v.innerHTML = `<div class="vt"><button class="ib" id="vClose">✕</button><span class="cnt" id="vCnt"></span><button class="ib" id="vCover">設為封面</button></div>
    <div class="vi" id="vi"><img id="vImg" alt=""></div>
    <div class="vb"><button class="ib" id="vPrev">‹ 上一張</button><button class="ib" id="vDel" style="color:var(--danger)">刪除</button><button class="ib" id="vNext">下一張 ›</button></div>`;
  v.classList.add('open');
  const draw = () => {
    if(vURL) URL.revokeObjectURL(vURL);
    const x = vState.list[vState.i]; vURL = URL.createObjectURL(x.blob);
    zoom.reset(false); $('#vImg').src = vURL; $('#vCnt').textContent = `${vState.i + 1} / ${vState.list.length}`;
    $('#vCover').textContent = x.id === vState.p.coverId ? '✓ 封面' : '設為封面';
  };
  const go = d => { vState.i = (vState.i + d + vState.list.length) % vState.list.length; draw(); };
  $('#vClose').onclick = closeViewer;
  $('#vPrev').onclick = () => go(-1); $('#vNext').onclick = () => go(1);
  $('#vCover').onclick = async () => { vState.p.coverId = vState.list[vState.i].id; await put('people', { ...vState.p, updatedAt: Date.now() }); toast('已設為封面'); draw(); vState.dirty = true; };
  $('#vDel').onclick = async () => {
    if(!confirm('確定刪除這張？')) return;
    const x = vState.list[vState.i]; await del('photos', x.id);
    vState.list.splice(vState.i, 1); vState.dirty = true; toast('已刪除');
    if(!vState.list.length) return closeViewer();
    vState.i = Math.min(vState.i, vState.list.length - 1); draw();
  };
  const zoom = makeZoom($('#vi'), $('#vImg'), go);
  vState.zoom = zoom;
  draw();
}
/* 照片縮放：雙指縮放、放大後單指拖曳、點兩下放大/還原；未放大時左右滑切換 */
function makeZoom(box, img, go){
  const MAX = 6;
  let s = 1, x = 0, y = 0;
  let start = null, lastTap = 0, lastTapPos = null;
  const center = () => { const r = box.getBoundingClientRect(); return { cx: r.left + r.width / 2, cy: r.top + r.height / 2, w: r.width, h: r.height }; };
  const clamp = () => {
    const c = center();
    const mx = Math.max(0, (img.offsetWidth * s - c.w) / 2), my = Math.max(0, (img.offsetHeight * s - c.h) / 2);
    x = Math.min(mx, Math.max(-mx, x)); y = Math.min(my, Math.max(-my, y));
  };
  const apply = anim => { img.classList.toggle('anim', !!anim); img.style.transform = `translate(${x}px,${y}px) scale(${s})`; };
  // 以畫面上某一點 (px,py) 為中心縮放到 ns
  const zoomAt = (ns, px, py, anim) => {
    const c = center(); const fx = px - c.cx, fy = py - c.cy;
    ns = Math.min(MAX, Math.max(1, ns));
    x = fx - (fx - x) * ns / s; y = fy - (fy - y) * ns / s; s = ns;
    if(s === 1){ x = 0; y = 0; }
    clamp(); apply(anim);
  };
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  const mid = t => ({ x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2 });

  box.ontouchstart = e => {
    e.preventDefault();
    const t = e.touches;
    if(t.length === 2){
      const m = mid(t), c = center();
      start = { type: 'pinch', d: dist(t), s, fx: m.x - c.cx, fy: m.y - c.cy, x, y };
    } else if(t.length === 1){
      start = { type: 'pan', px: t[0].clientX, py: t[0].clientY, x, y, moved: false, time: Date.now() };
    }
  };
  box.ontouchmove = e => {
    e.preventDefault();
    const t = e.touches; if(!start) return;
    if(start.type === 'pinch' && t.length === 2){
      const m = mid(t), c = center();
      const ns = Math.min(MAX, Math.max(1, start.s * dist(t) / start.d));
      // 起始時焦點下的圖片位置，跟著手指移動
      const px = (start.fx - start.x) / start.s, py = (start.fy - start.y) / start.s;
      x = (m.x - c.cx) - px * ns; y = (m.y - c.cy) - py * ns; s = ns;
      clamp(); apply(false);
    } else if(start.type === 'pan' && t.length === 1){
      const dx = t[0].clientX - start.px, dy = t[0].clientY - start.py;
      if(Math.abs(dx) > 6 || Math.abs(dy) > 6) start.moved = true;
      if(s > 1){ x = start.x + dx; y = start.y + dy; clamp(); apply(false); }
    }
  };
  box.ontouchend = e => {
    e.preventDefault();
    if(!start) return;
    if(start.type === 'pinch'){
      if(e.touches.length === 1){ // 放開一指，改成拖曳
        start = { type: 'pan', px: e.touches[0].clientX, py: e.touches[0].clientY, x, y, moved: true, time: Date.now() };
      } else { if(s < 1.05) zoomAt(1, 0, 0, true); start = null; }
      return;
    }
    if(e.touches.length) return;
    const ct = e.changedTouches[0], dx = ct.clientX - start.px;
    if(!start.moved){ // 點一下：判斷是否為點兩下
      const now = Date.now();
      if(now - lastTap < 300 && lastTapPos && Math.hypot(ct.clientX - lastTapPos.x, ct.clientY - lastTapPos.y) < 40){
        s > 1 ? zoomAt(1, 0, 0, true) : zoomAt(2.5, ct.clientX, ct.clientY, true);
        lastTap = 0;
      } else { lastTap = now; lastTapPos = { x: ct.clientX, y: ct.clientY }; }
    } else if(s === 1 && Math.abs(dx) > 50){
      go(dx < 0 ? 1 : -1);
    }
    start = null;
  };
  // 電腦：滾輪縮放、雙擊放大
  box.onwheel = e => { e.preventDefault(); zoomAt(s * (e.deltaY < 0 ? 1.15 : 1 / 1.15), e.clientX, e.clientY, false); };
  box.ondblclick = e => { s > 1 ? zoomAt(1, 0, 0, true) : zoomAt(2.5, e.clientX, e.clientY, true); };
  let drag = null;
  box.onmousedown = e => { if(s > 1) drag = { px: e.clientX, py: e.clientY, x, y }; };
  window.addEventListener('mousemove', e => { if(drag){ x = drag.x + e.clientX - drag.px; y = drag.y + e.clientY - drag.py; clamp(); apply(false); } });
  window.addEventListener('mouseup', () => drag = null);
  return { reset(anim){ s = 1; x = 0; y = 0; apply(anim); } };
}
function closeViewer(){
  const v = $('#viewer'); if(!v.classList.contains('open')) return;
  v.classList.remove('open'); v.innerHTML = '';
  if(vURL){ URL.revokeObjectURL(vURL); vURL = ''; }
  const dirty = vState?.dirty; vState = null;
  if(dirty) refresh();
}

/* ---------- settings / backup ---------- */
const toDataURL = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });
const fromDataURL = async u => (await fetch(u)).blob();
async function renderSettings(){
  const est = await navigator.storage?.estimate?.().catch(() => null);
  const persisted = await navigator.storage?.persisted?.().catch(() => false);
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const [pc, mc, phc] = await Promise.all(['people', 'meetings', 'photos'].map(s => P(store(s).count())));
  app.innerHTML = `
  <header class="top"><a class="ib big" href="#/">‹</a><h1>設定與備份</h1></header>
  <div class="wrap">
    <div class="panel">
      <div class="row"><span class="k">資料</span><span class="v">${pc} 人 · ${mc} 次見面 · ${phc} 張圖</span></div>
      <div class="row"><span class="k">已用空間</span><span class="v">${est ? (est.usage / 1048576).toFixed(1) + ' MB' : '—'}</span></div>
      <div class="row"><span class="k">持久儲存</span><span class="v">${persisted ? '✅ 已啟用' : '⚠️ 未啟用'}</span></div>
      <div class="row"><span class="k">安裝狀態</span><span class="v">${standalone ? '✅ 主畫面 App' : '瀏覽器模式'}</span></div>
    </div>
    <div class="hint" style="padding:0 4px">⚠️ 所有資料只存在這支手機的 App 裡，不會上傳任何伺服器。刪除 App 或清除 Safari 資料會全部消失，請定期「匯出備份」存到「檔案」App 或 iCloud。</div>
    <div class="sec-t">外觀</div>
    <div class="pick tpick" id="themePick">
      ${[['auto', '跟隨系統'], ['light', '☀︎ 淺色'], ['dark', '☾ 深色']].map(([k, n]) => `<button type="button" data-v="${k}" class="${getTheme() === k ? 'on' : ''}">${n}</button>`).join('')}
    </div>
    <div class="sec-t">備份</div>
    <button class="btn" id="exp">⬆︎ 匯出備份（含照片）</button>
    <button class="btn ghost" id="imp">⬇︎ 匯入備份</button>
    ${standalone ? '' : `<div class="sec-t">安裝到 iPhone 主畫面</div>
    <div class="panel hint" style="padding:12px 14px"><ol>
      <li>用 <b>Safari</b> 開啟這個網址</li><li>點下方「分享」按鈕 <b>⎋</b></li>
      <li>選「<b>加入主畫面</b>」→ 新增</li><li>之後從主畫面圖示開啟即可全螢幕、離線使用</li></ol></div>`}
    <div class="sec-t">危險區</div>
    <button class="btn danger" id="wipe">清除全部資料</button>
    <div class="hint" style="text-align:center;margin-top:24px">Record v21</div>
  </div>`;
  $$('#themePick button').forEach(b => b.onclick = () => {
    setTheme(b.dataset.v);
    $$('#themePick button').forEach(x => x.classList.toggle('on', x === b));
  });
  $('#exp').onclick = exportAll;
  $('#imp').onclick = () => { $('#importIn').value = ''; $('#importIn').click(); };
  $('#wipe').onclick = async () => {
    if(!confirm('確定清除「全部」資料？建議先匯出備份。此動作無法復原。')) return;
    if(!confirm('再確認一次：真的要全部刪除？')) return;
    for(const s of ['people', 'meetings', 'photos']) await P(store(s, 'readwrite').clear());
    toast('已清除'); location.hash = '#/';
  };
}
async function exportAll(){
  toast('打包中…', 60000);
  const [people, meetings, photos] = await Promise.all([getAll('people'), getAll('meetings'), getAll('photos')]);
  const ph = [];
  for(const x of photos) ph.push({ ...x, blob: await toDataURL(x.blob), thumb: x.thumb ? await toDataURL(x.thumb) : null });
  const json = JSON.stringify({ app: 'datelog', version: 1, exportedAt: new Date().toISOString(), people, meetings, photos: ph });
  const file = new File([json], `交友紀錄備份-${today()}.json`, { type: 'application/json' });
  toast(`備份大小 ${(file.size / 1048576).toFixed(1)} MB`);
  if(navigator.canShare && navigator.canShare({ files: [file] })){
    try { await navigator.share({ files: [file], title: file.name }); return; } catch(e){ if(e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
$('#importIn').onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  try {
    const data = JSON.parse(await f.text());
    if(data.app !== 'datelog') throw new Error('格式不符');
    if(!confirm(`備份內含 ${data.people.length} 人、${data.meetings.length} 次見面、${data.photos.length} 張圖。\n要匯入嗎？（相同項目會被覆蓋，其他資料保留）`)) return;
    toast('匯入中…', 60000);
    for(const p of data.people) await put('people', p);
    for(const m of data.meetings) await put('meetings', m);
    for(const x of data.photos) await put('photos', { ...x, blob: await fromDataURL(x.blob), thumb: x.thumb ? await fromDataURL(x.thumb) : null });
    toast('匯入完成'); location.hash = '#/'; route();
  } catch(err){ console.error(err); alert('匯入失敗：' + err.message); }
};

/* ---------- theme ---------- */
function getTheme(){ try { return localStorage.getItem('theme') || 'auto'; } catch(e){ return 'auto'; } }
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){
  const t = getTheme();
  if(t === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  const dark = t === 'dark' || (t === 'auto' && darkMQ.matches);
  $('#themeColor').content = dark ? '#121016' : '#f6f4f8';
}
function setTheme(t){ try { localStorage.setItem('theme', t); } catch(e){} applyTheme(); }
darkMQ.addEventListener?.('change', applyTheme);
applyTheme();

/* ---------- boot ---------- */
(async () => {
  try { db = await openDB(); } catch(e){ app.innerHTML = `<div class="empty">無法開啟資料庫：${esc(e.message)}<br>請確認不是在「私密瀏覽」模式。</div>`; return; }
  route();
  if('serviceWorker' in navigator && location.protocol !== 'file:'){
    // 有新版 service worker 接手時自動重新整理一次
    const hadController = !!navigator.serviceWorker.controller;
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if(hadController && !reloaded){ reloaded = true; location.reload(); } });
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
      // App 從背景回到前景時檢查更新（iOS 主畫面 App 常常只是從背景喚醒，不會重新載入）
      document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') reg.update().catch(() => {}); });
    }).catch(console.warn);
  }
})();
</script>
